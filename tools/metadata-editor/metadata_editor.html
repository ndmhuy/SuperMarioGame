<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Sheet Metadata Editor Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(20, 27, 45, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
            --accent-hover: #0284c7;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --font-family: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        header {
            height: 60px;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
        }

        .brand h1 { font-size: 1.1rem; font-weight: 600; }
        .brand span { color: var(--text-muted); font-size: 0.85rem; }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: var(--font-family);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .btn-primary {
            background: var(--accent-gradient);
            border: none;
            color: #0b0f19;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger);
            color: #fff;
        }

        /* Layout Main */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 340px;
            overflow: hidden;
        }

        /* Left Panel: Frame List */
        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-right {
            border-right: none;
            border-left: 1px solid var(--panel-border);
        }

        .panel-header {
            padding: 16px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-title {
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .search-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--panel-border);
        }

        .input-text, .input-num {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-main);
            font-family: var(--font-family);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-text:focus, .input-num:focus {
            border-color: var(--accent-color);
        }

        .frame-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .frame-item {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
            transition: all 0.15s ease;
        }

        .frame-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        .frame-item.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            border-left: 3px solid var(--accent-color);
            font-weight: 500;
        }

        .frame-badge {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        /* Workspace */
        .workspace {
            position: relative;
            background: #070a12;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
        }

        .canvas-container {
            position: relative;
            cursor: default;
            transform-origin: center center;
            transition: transform 0.05s ease-out;
        }

        canvas {
            display: block;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            image-rendering: pixelated;
        }

        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            gap: 4px;
            padding: 4px;
            z-index: 5;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.1); }

        .toolbar-mode {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            gap: 6px;
            padding: 6px;
            z-index: 5;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mode-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .pos-finder-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px 14px;
            z-index: 5;
            display: flex;
            flex-direction: column;
            gap: 2px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .pos-finder-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .pos-finder-val {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        .pos-finder-sub {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Inspector */
        .inspector-section {
            padding: 20px;
            border-bottom: 1px solid var(--panel-border);
        }

        .preview-box {
            width: 100%;
            height: 160px;
            background-color: #111827;
            background-image: 
                linear-gradient(45deg, #1f2937 25%, transparent 25%), 
                linear-gradient(-45deg, #1f2937 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1f2937 75%), 
                linear-gradient(-45deg, transparent 75%, #1f2937 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .preview-canvas { image-rendering: pixelated; }

        .field-group { margin-bottom: 14px; }
        .field-label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .step-btn-group {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .step-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 4px 0;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
        }

        .step-btn:hover { background: rgba(255, 255, 255, 0.12); }

        .dropzone-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            z-index: 50;
        }

        .dropzone-box {
            border: 2px dashed var(--accent-color);
            border-radius: 12px;
            padding: 40px 60px;
            text-align: center;
            background: rgba(56, 189, 248, 0.05);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="brand">
            <div class="brand-icon">E</div>
            <div>
                <h1>Metadata Editor Studio</h1>
                <span>Add, Delete & Modify Frame Rectangles</span>
            </div>
        </div>
        <div class="header-actions">
            <input type="file" id="fileImageInput" accept="image/png" style="display: none;">
            <input type="file" id="fileJsonInput" accept="application/json" style="display: none;">
            <button class="btn" onclick="document.getElementById('fileImageInput').click()">📷 Open PNG</button>
            <button class="btn" onclick="document.getElementById('fileJsonInput').click()">📄 Open JSON</button>
            <button class="btn btn-primary" id="btnAddFrame">➕ Add Frame</button>
            <button class="btn btn-primary" id="btnExport">💾 Export JSON</button>
        </div>
    </header>

    <!-- Main -->
    <main>
        <!-- Left Panel: Frame List -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Sprite Frames (<span id="frameCount">0</span>)</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchFrame" class="input-text" placeholder="Search frame name...">
            </div>
            <div class="frame-list" id="frameList"></div>
        </div>

        <!-- Center Workspace Canvas -->
        <div class="workspace" id="workspace">
            <div class="dropzone-overlay" id="dropzone">
                <div class="dropzone-box">
                    <h2>Drag & Drop Spritesheet PNG and JSON Metadata</h2>
                    <p style="color: var(--text-muted); margin-top: 8px;">Or use the top header buttons to open files</p>
                </div>
            </div>

            <!-- Toolbar Mode -->
            <div class="toolbar-mode">
                <button class="mode-btn active" id="modeSelect">👆 Select & Modify</button>
                <button class="mode-btn" id="modeDraw">✏️ Drag to Draw Box</button>
            </div>

            <!-- Position Finder HUD -->
            <div class="pos-finder-hud" id="posFinderHud">
                <div class="pos-finder-title">📍 Position Finder</div>
                <div class="pos-finder-val" id="posFinderCoords">X: --, Y: --</div>
                <div class="pos-finder-sub" id="posFinderTile">Tile (16x16): Col --, Row --</div>
            </div>

            <div class="canvas-container" id="canvasContainer">
                <canvas id="mainCanvas"></canvas>
            </div>
            <div class="zoom-controls">
                <button class="icon-btn" id="btnZoomOut" title="Zoom Out">-</button>
                <button class="icon-btn" id="btnZoomReset" title="Reset Zoom">100%</button>
                <button class="icon-btn" id="btnZoomIn" title="Zoom In">+</button>
            </div>
        </div>

        <!-- Right Panel: Inspector & Editor -->
        <div class="panel panel-right">
            <div class="panel-header">
                <span class="panel-title">Frame Inspector</span>
            </div>
            <div class="inspector-section">
                <div class="preview-box">
                    <canvas id="previewCanvas" class="preview-canvas"></canvas>
                </div>

                <div class="field-group">
                    <label class="field-label">Frame Identifier (Name)</label>
                    <input type="text" id="inputName" class="input-text" placeholder="Select a frame..." disabled>
                </div>

                <div class="grid-2">
                    <div class="field-group">
                        <label class="field-label">Position X</label>
                        <input type="number" id="inputX" class="input-num" disabled>
                        <div class="step-btn-group">
                            <button class="step-btn" onclick="stepVal('inputX', -16)">-16</button>
                            <button class="step-btn" onclick="stepVal('inputX', -1)">-1</button>
                            <button class="step-btn" onclick="stepVal('inputX', 1)">+1</button>
                            <button class="step-btn" onclick="stepVal('inputX', 16)">+16</button>
                        </div>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Position Y</label>
                        <input type="number" id="inputY" class="input-num" disabled>
                        <div class="step-btn-group">
                            <button class="step-btn" onclick="stepVal('inputY', -16)">-16</button>
                            <button class="step-btn" onclick="stepVal('inputY', -1)">-1</button>
                            <button class="step-btn" onclick="stepVal('inputY', 1)">+1</button>
                            <button class="step-btn" onclick="stepVal('inputY', 16)">+16</button>
                        </div>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="field-group">
                        <label class="field-label">Width (W)</label>
                        <input type="number" id="inputW" class="input-num" disabled>
                        <div class="step-btn-group">
                            <button class="step-btn" onclick="stepVal('inputW', -8)">-8</button>
                            <button class="step-btn" onclick="stepVal('inputW', -1)">-1</button>
                            <button class="step-btn" onclick="stepVal('inputW', 1)">+1</button>
                            <button class="step-btn" onclick="stepVal('inputW', 8)">+8</button>
                        </div>
                    </div>
                    <div class="field-group">
                        <label class="field-label">Height (H)</label>
                        <input type="number" id="inputH" class="input-num" disabled>
                        <div class="step-btn-group">
                            <button class="step-btn" onclick="stepVal('inputH', -8)">-8</button>
                            <button class="step-btn" onclick="stepVal('inputH', -1)">-1</button>
                            <button class="step-btn" onclick="stepVal('inputH', 1)">+1</button>
                            <button class="step-btn" onclick="stepVal('inputH', 8)">+8</button>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <button class="btn btn-danger" id="btnDelete" style="flex: 1;" disabled>🗑️ Delete Frame</button>
                    <button class="btn" id="btnDuplicate" style="flex: 1;" disabled>📋 Duplicate</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // State
        let image = null;
        let jsonData = { frames: {}, meta: {} };
        let selectedFrameKey = null;
        let mode = 'select'; // 'select' or 'draw'
        let zoom = 1.0;
        let panX = 0, panY = 0;
        let isDragging = false, dragStartX = 0, dragStartY = 0;
        let isDrawing = false, drawStartX = 0, drawStartY = 0, currentDrawRect = null;
        let isResizing = false;

        // Elements
        const mainCanvas = document.getElementById('mainCanvas');
        const ctx = mainCanvas.getContext('2d');
        const previewCanvas = document.getElementById('previewCanvas');
        const pCtx = previewCanvas.getContext('2d');
        const workspace = document.getElementById('workspace');
        const dropzone = document.getElementById('dropzone');
        const frameListEl = document.getElementById('frameList');
        const frameCountEl = document.getElementById('frameCount');

        const inputName = document.getElementById('inputName');
        const inputX = document.getElementById('inputX');
        const inputY = document.getElementById('inputY');
        const inputW = document.getElementById('inputW');
        const inputH = document.getElementById('inputH');

        const btnDelete = document.getElementById('btnDelete');
        const btnDuplicate = document.getElementById('btnDuplicate');

        // File Drag & Drop
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            for (let f of e.dataTransfer.files) {
                if (f.type.startsWith('image/')) loadPNG(f);
                else if (f.name.endsWith('.json')) loadJSON(f);
            }
        });

        document.getElementById('fileImageInput').onchange = (e) => { if(e.target.files[0]) loadPNG(e.target.files[0]); };
        document.getElementById('fileJsonInput').onchange = (e) => { if(e.target.files[0]) loadJSON(e.target.files[0]); };

        function loadPNG(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    image = img;
                    dropzone.style.display = 'none';
                    resetCanvasView();
                    render();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function loadJSON(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    jsonData = JSON.parse(e.target.result);
                    if (!jsonData.frames) jsonData.frames = {};
                    updateFrameList();
                    render();
                } catch(err) { alert('Invalid JSON format!'); }
            };
            reader.readAsText(file);
        }

        function resetCanvasView() {
            if (!image) return;
            mainCanvas.width = image.width;
            mainCanvas.height = image.height;
            zoom = Math.min(
                (workspace.clientWidth - 40) / image.width,
                (workspace.clientHeight - 40) / image.height,
                2.0
            );
            panX = 0; panY = 0;
            updateCanvasTransform();
        }

        function updateCanvasTransform() {
            const container = document.getElementById('canvasContainer');
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
            document.getElementById('btnZoomReset').innerText = `${Math.round(zoom * 100)}%`;
        }

        // Zoom & Pan Mouse Wheel Listeners (Zoom to Cursor)
        let lastMousePos = { x: 0, y: 0 };
        workspace.addEventListener('mousemove', (e) => {
            lastMousePos = { x: e.clientX, y: e.clientY };
        });

        function zoomAtPoint(targetZoom, clientX, clientY) {
            if (!image) return;
            const newZoom = Math.min(Math.max(targetZoom, 0.1), 10.0);
            if (newZoom === zoom) return;

            const workspaceRect = workspace.getBoundingClientRect();
            const cursorX = clientX - (workspaceRect.left + workspaceRect.width / 2);
            const cursorY = clientY - (workspaceRect.top + workspaceRect.height / 2);

            const scaleFactor = newZoom / zoom;
            panX = cursorX - (cursorX - panX) * scaleFactor;
            panY = cursorY - (cursorY - panY) * scaleFactor;
            zoom = newZoom;

            updateCanvasTransform();
        }

        workspace.addEventListener('wheel', (e) => {
            if (!image) return;
            e.preventDefault();
            const delta = e.deltaY < 0 ? 1.15 : 0.85;
            zoomAtPoint(zoom * delta, e.clientX, e.clientY);
        });

        document.getElementById('btnZoomIn').onclick = () => {
            const workspaceRect = workspace.getBoundingClientRect();
            const centerX = workspaceRect.left + workspaceRect.width / 2;
            const centerY = workspaceRect.top + workspaceRect.height / 2;
            zoomAtPoint(zoom * 1.25, lastMousePos.x || centerX, lastMousePos.y || centerY);
        };

        document.getElementById('btnZoomOut').onclick = () => {
            const workspaceRect = workspace.getBoundingClientRect();
            const centerX = workspaceRect.left + workspaceRect.width / 2;
            const centerY = workspaceRect.top + workspaceRect.height / 2;
            zoomAtPoint(zoom / 1.25, lastMousePos.x || centerX, lastMousePos.y || centerY);
        };

        document.getElementById('btnZoomReset').onclick = () => resetCanvasView();

        // Helper to convert mouse viewport coords to canvas image coords
        function getCanvasMousePos(e) {
            const rect = mainCanvas.getBoundingClientRect();
            const scaleX = rect.width / mainCanvas.width;
            const scaleY = rect.height / mainCanvas.height;
            return {
                x: Math.round((e.clientX - rect.left) / scaleX),
                y: Math.round((e.clientY - rect.top) / scaleY)
            };
        }

        // Toolbar Mode
        document.getElementById('modeSelect').onclick = () => setMode('select');
        document.getElementById('modeDraw').onclick = () => setMode('draw');

        function setMode(m) {
            mode = m;
            document.getElementById('modeSelect').classList.toggle('active', mode === 'select');
            document.getElementById('modeDraw').classList.toggle('active', mode === 'draw');
            document.getElementById('canvasContainer').style.cursor = mode === 'draw' ? 'crosshair' : 'default';
        }

        let hoveredPixel = null;

        // Render Canvas
        function render() {
            if (!image) return;
            ctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
            ctx.drawImage(image, 0, 0);

            // Draw bounding boxes for all frames
            for (let key in jsonData.frames) {
                const f = jsonData.frames[key].frame;
                const isSelected = (key === selectedFrameKey);

                ctx.lineWidth = isSelected ? 2 : 1;
                ctx.strokeStyle = isSelected ? '#38bdf8' : 'rgba(255, 255, 255, 0.4)';
                ctx.strokeRect(f.x, f.y, f.w, f.h);

                if (isSelected) {
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.2)';
                    ctx.fillRect(f.x, f.y, f.w, f.h);

                    // Resize corner handle
                    ctx.fillStyle = '#38bdf8';
                    ctx.fillRect(f.x + f.w - 4, f.y + f.h - 4, 8, 8);
                }
            }

            // Draw currently drawing rectangle
            if (currentDrawRect) {
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#10b981';
                ctx.setLineDash([4, 4]);
                ctx.strokeRect(currentDrawRect.x, currentDrawRect.y, currentDrawRect.w, currentDrawRect.h);
                ctx.setLineDash([]);
            }

            // Draw hovered pixel crosshair highlight
            if (hoveredPixel && hoveredPixel.x >= 0 && hoveredPixel.x < mainCanvas.width && hoveredPixel.y >= 0 && hoveredPixel.y < mainCanvas.height) {
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#f59e0b';
                ctx.strokeRect(hoveredPixel.x - 0.5, hoveredPixel.y - 0.5, 2, 2);
            }
        }

        // Canvas Mouse Events
        mainCanvas.addEventListener('mousedown', (e) => {
            if (!image) return;
            const mouse = getCanvasMousePos(e);

            if (e.button === 1 || e.spaceKey) {
                isDragging = true;
                dragStartX = e.clientX - panX;
                dragStartY = e.clientY - panY;
                return;
            }

            if (mode === 'draw') {
                isDrawing = true;
                drawStartX = mouse.x;
                drawStartY = mouse.y;
                currentDrawRect = { x: mouse.x, y: mouse.y, w: 1, h: 1 };
                render();
            } else { // select & modify
                if (selectedFrameKey && jsonData.frames[selectedFrameKey]) {
                    const f = jsonData.frames[selectedFrameKey].frame;
                    // Check if clicking resize corner (bottom right)
                    if (Math.abs(mouse.x - (f.x + f.w)) <= 8 && Math.abs(mouse.y - (f.y + f.h)) <= 8) {
                        isResizing = true;
                        return;
                    }
                }

                // Check hit frame
                let hitKey = null;
                for (let key in jsonData.frames) {
                    const f = jsonData.frames[key].frame;
                    if (mouse.x >= f.x && mouse.x <= f.x + f.w && mouse.y >= f.y && mouse.y <= f.y + f.h) {
                        hitKey = key;
                        break;
                    }
                }
                selectFrame(hitKey);
            }
        });

        window.addEventListener('mousemove', (e) => {
            lastMousePos = { x: e.clientX, y: e.clientY };

            if (isDragging) {
                panX = e.clientX - dragStartX;
                panY = e.clientY - dragStartY;
                updateCanvasTransform();
                return;
            }

            if (!image) return;
            const mouse = getCanvasMousePos(e);

            // Update Position Finder HUD
            if (mouse.x >= 0 && mouse.x < mainCanvas.width && mouse.y >= 0 && mouse.y < mainCanvas.height) {
                hoveredPixel = { x: mouse.x, y: mouse.y };
                document.getElementById('posFinderCoords').innerText = `X: ${mouse.x}, Y: ${mouse.y}`;
                document.getElementById('posFinderTile').innerText = `Tile (16x16): Col ${Math.floor(mouse.x / 16)}, Row ${Math.floor(mouse.y / 16)}`;
            } else {
                hoveredPixel = null;
                document.getElementById('posFinderCoords').innerText = `X: --, Y: --`;
                document.getElementById('posFinderTile').innerText = `Tile (16x16): Col --, Row --`;
            }

            if (isDrawing) {
                currentDrawRect = {
                    x: Math.min(drawStartX, mouse.x),
                    y: Math.min(drawStartY, mouse.y),
                    w: Math.abs(mouse.x - drawStartX),
                    h: Math.abs(mouse.y - drawStartY)
                };
                render();
            } else if (isResizing && selectedFrameKey) {
                const f = jsonData.frames[selectedFrameKey].frame;
                f.w = Math.max(1, mouse.x - f.x);
                f.h = Math.max(1, mouse.y - f.y);
                updateInspector();
                render();
            } else {
                render();
            }
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
            isResizing = false;

            if (isDrawing && currentDrawRect) {
                isDrawing = false;
                if (currentDrawRect.w > 2 && currentDrawRect.h > 2) {
                    addNewFrameFromRect(currentDrawRect);
                }
                currentDrawRect = null;
                render();
            }
        });

        // Frame Operations (Add, Delete, Modify)
        function addNewFrameFromRect(r) {
            const newKey = prompt("Enter name for new frame:", `frame_${Object.keys(jsonData.frames).length}`);
            if (!newKey) return;
            if (jsonData.frames[newKey]) return alert("Frame name already exists!");

            jsonData.frames[newKey] = {
                frame: { x: r.x, y: r.y, w: r.w, h: r.h },
                rotated: false,
                trimmed: false,
                spriteSourceSize: { x: 0, y: 0, w: r.w, h: r.h },
                sourceSize: { w: r.w, h: r.h }
            };

            updateFrameList();
            selectFrame(newKey);
            setMode('select');
        }

        document.getElementById('btnAddFrame').onclick = () => {
            if (!image) return alert("Load PNG spritesheet first!");
            addNewFrameFromRect({ x: 0, y: 0, w: 32, h: 32 });
        };

        btnDelete.onclick = () => {
            if (!selectedFrameKey) return;
            if (confirm(`Delete frame '${selectedFrameKey}' from JSON metadata?\n(Note: Does NOT modify PNG image)`)) {
                delete jsonData.frames[selectedFrameKey];
                selectedFrameKey = null;
                updateFrameList();
                updateInspector();
                render();
            }
        };

        btnDuplicate.onclick = () => {
            if (!selectedFrameKey) return;
            const newKey = prompt("Enter name for duplicated frame:", `${selectedFrameKey}_copy`);
            if (!newKey) return;
            if (jsonData.frames[newKey]) return alert("Frame name already exists!");

            jsonData.frames[newKey] = JSON.parse(JSON.stringify(jsonData.frames[selectedFrameKey]));
            updateFrameList();
            selectFrame(newKey);
        };

        function selectFrame(key) {
            selectedFrameKey = key;
            render();
            updateInspector();
            highlightFrameListItem();
        }

        function updateFrameList() {
            const filter = document.getElementById('searchFrame').value.toLowerCase();
            frameListEl.innerHTML = '';
            let count = 0;

            for (let key in jsonData.frames) {
                count++;
                if (filter && !key.toLowerCase().includes(filter)) continue;

                const f = jsonData.frames[key].frame;
                const div = document.createElement('div');
                div.className = `frame-item ${key === selectedFrameKey ? 'active' : ''}`;
                div.dataset.key = key;
                div.innerHTML = `
                    <span>${key}</span>
                    <span class="frame-badge">${f.w}x${f.h}</span>
                `;
                div.onclick = () => selectFrame(key);
                frameListEl.appendChild(div);
            }
            frameCountEl.innerText = count;
        }

        function highlightFrameListItem() {
            document.querySelectorAll('.frame-item').forEach(el => {
                el.classList.toggle('active', el.dataset.key === selectedFrameKey);
                if (el.dataset.key === selectedFrameKey) el.scrollIntoView({ block: 'nearest' });
            });
        }

        function updateInspector() {
            if (!selectedFrameKey || !jsonData.frames[selectedFrameKey]) {
                inputName.value = ''; inputName.disabled = true;
                inputX.value = ''; inputX.disabled = true;
                inputY.value = ''; inputY.disabled = true;
                inputW.value = ''; inputW.disabled = true;
                inputH.value = ''; inputH.disabled = true;
                btnDelete.disabled = true;
                btnDuplicate.disabled = true;
                pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
                return;
            }

            const frameData = jsonData.frames[selectedFrameKey];
            const f = frameData.frame;

            inputName.disabled = false; inputName.value = selectedFrameKey;
            inputX.disabled = false; inputX.value = f.x;
            inputY.disabled = false; inputY.value = f.y;
            inputW.disabled = false; inputW.value = f.w;
            inputH.disabled = false; inputH.value = f.h;

            btnDelete.disabled = false;
            btnDuplicate.disabled = false;

            // Crop preview
            previewCanvas.width = f.w * 3;
            previewCanvas.height = f.h * 3;
            pCtx.imageSmoothingEnabled = false;
            pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
            if (image) {
                pCtx.drawImage(image, f.x, f.y, f.w, f.h, 0, 0, previewCanvas.width, previewCanvas.height);
            }
        }

        // Modifications Handling
        inputName.onchange = () => {
            const newName = inputName.value.trim();
            if (!selectedFrameKey || !newName || newName === selectedFrameKey) return;
            if (jsonData.frames[newName]) { alert("Frame name already exists!"); inputName.value = selectedFrameKey; return; }

            const newFrames = {};
            for (let k in jsonData.frames) {
                newFrames[k === selectedFrameKey ? newName : k] = jsonData.frames[k];
            }
            jsonData.frames = newFrames;
            selectedFrameKey = newName;
            updateFrameList();
            render();
        };

        [inputX, inputY, inputW, inputH].forEach(input => {
            input.onchange = () => updateRectFromInputs();
            input.oninput = () => updateRectFromInputs();
        });

        function updateRectFromInputs() {
            if (!selectedFrameKey || !jsonData.frames[selectedFrameKey]) return;
            const f = jsonData.frames[selectedFrameKey].frame;
            f.x = parseInt(inputX.value) || 0;
            f.y = parseInt(inputY.value) || 0;
            f.w = Math.max(1, parseInt(inputW.value) || 1);
            f.h = Math.max(1, parseInt(inputH.value) || 1);
            render();
            updateInspector();
        }

        window.stepVal = (inputId, delta) => {
            const el = document.getElementById(inputId);
            if (!el || el.disabled) return;
            el.value = (parseInt(el.value) || 0) + delta;
            updateRectFromInputs();
        };

        document.getElementById('searchFrame').oninput = () => updateFrameList();

        // Export JSON
        document.getElementById('btnExport').onclick = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(jsonData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "sprites_metadata.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        };
    </script>
</body>
</html>

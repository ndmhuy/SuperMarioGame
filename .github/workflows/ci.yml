name: build-and-test

# The August 2026 audit found three critical defects and six inert subsystems
# that survived because nothing ran automatically. This workflow is the guard.

on:
  push:
    branches: [main, dev, "A/**", "B/**"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # SFML 3 builds from source via FetchContent and needs X11/udev/GL headers.
      - name: Install SFML build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libfreetype-dev libflac-dev libvorbis-dev libgl1-mesa-dev \
            libegl1-mesa-dev libdrm-dev libgbm-dev

      # FetchContent pulls SFML, ImGui, ImGui-SFML and nlohmann/json every run
      # otherwise, which dominates the build time.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: SuperMarioGame/build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('SuperMarioGame/CMakeLists.txt') }}
          restore-keys: deps-${{ runner.os }}-

      - name: Configure
        working-directory: SuperMarioGame
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build game
        working-directory: SuperMarioGame
        run: cmake --build build --target SuperMarioGame -j$(nproc)

      # `ctest_binaries` depends on every case add_verify_test registers, so this
      # cannot fall behind the test list again. It previously built only
      # verify_regressions while ctest ran thirteen cases, and the eleven missing
      # binaries reported "***Not Run" — every run in this repository was red for
      # that reason alone, including on dev.
      - name: Build test binaries
        working-directory: SuperMarioGame
        run: cmake --build build --target ctest_binaries -j$(nproc)

      # The harnesses construct SoundManager, and SFML opens a playback device
      # when they do. A GitHub runner has no sound card, so ALSA fails, miniaudio
      # reports "Failed to open backend device", and verify_regressions died with
      # SIGABRT before its first check. snd-dummy is a real loopback device and is
      # preferred; the null ALSA default is the fallback for runners that will not
      # load the module.
      - name: Provide an audio device
        run: |
          sudo apt-get install -y alsa-utils libasound2-plugins
          sudo modprobe snd-dummy || echo "snd-dummy unavailable, falling back to the null device"
          printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"

      - name: Run tests
        working-directory: SuperMarioGame
        run: ctest --test-dir build --output-on-failure
